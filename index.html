<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b140f">
<title>Teen Patti</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231b140f'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='%23f2a900'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;700&family=Kalam:wght@400;700&family=Rozha+One&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --paper:#1b140f;--paper2:#281c14;--ink:#efe3c6;--mut:#b4a587;--rule:rgba(240,200,120,.11);--margin:rgba(238,106,82,.65);
  --gold:#f0a41c;--goldink:#1b1204;--acc:#f0a41c;--red:#ee6a52;--win:#9ccd6e;--line:rgba(239,227,198,.32);
  --card:#fbf3de;--cardink:#201710;--cardred:#b3261e;--shadow:rgba(0,0,0,.55);
}
[data-theme=light]{
  --paper:#f1e6cc;--paper2:#e9dcbb;--ink:#1d2742;--mut:#566079;--rule:rgba(52,86,140,.2);--margin:rgba(190,52,36,.6);
  --gold:#e3a017;--goldink:#1d2742;--acc:#8f5300;--red:#b3321f;--win:#2b6b3b;--line:rgba(29,39,66,.4);--shadow:rgba(29,39,66,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 34px) fixed,var(--paper);
  color:var(--ink);font:16px/1.45 Hind,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;
}
button,input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,.potv,.code,.hn2,.rank li::before{font-family:"Rozha One",Georgia,serif;font-weight:400}
h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-top:6px}
.mut{color:var(--mut)}
.hand-w,.stk,.msg,.hist p{font-family:Kalam,"Segoe Print",cursive}
#conn{position:fixed;top:0;left:0;right:0;z-index:50;text-align:center;font-size:13px;font-weight:700;background:var(--gold);color:var(--goldink);padding:calc(3px + env(safe-area-inset-top)) 8px 3px;display:none}
#conn.on{display:block}
.cx{margin-left:8px;border:2px solid currentColor;background:none;color:inherit;border-radius:6px;padding:0 10px;font-weight:700;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
#toast.on{opacity:1}

/* buttons and inputs */
.btn{padding:12px 10px;border-radius:8px;border:2px solid var(--ink);background:var(--paper2);color:var(--ink);font-weight:700;font-size:15px;min-height:48px;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--gold);color:var(--goldink)}
.btn.danger{color:var(--red);border-color:var(--red);box-shadow:3px 3px 0 var(--red)}
.btn.flat{box-shadow:none;border-style:dashed;background:transparent}
.btn:disabled{opacity:.4;box-shadow:none;pointer-events:none}
.tab{padding:6px 12px;border:2px solid var(--ink);border-radius:6px;background:transparent;font-weight:700;font-size:14px;cursor:pointer}
.tab:active{background:var(--ink);color:var(--paper)}
input{border:0;border-bottom:2px solid var(--ink);background:transparent;border-radius:0;padding:10px 2px;font-size:18px;outline:none;width:100%}
input:focus{border-bottom-color:var(--acc)}
input:disabled{opacity:.6}

/* home */
.home{max-width:440px;margin:0 auto;min-height:100dvh;padding:calc(36px + env(safe-area-inset-top)) 22px 40px 38px;display:flex;flex-direction:column;gap:16px;background:linear-gradient(90deg,transparent 16px,var(--margin) 16px,var(--margin) 18px,transparent 18px)}
.cover{align-self:flex-start;border:3px double var(--ink);padding:12px 18px 10px;background:var(--paper2);transform:rotate(-1.5deg);box-shadow:4px 4px 0 var(--shadow)}
.cover small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);font-weight:700}
.cover h1{font-size:54px;line-height:1.05;color:var(--acc)}
.sub{font-size:17px}
.lab{display:flex;flex-direction:column;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}
.row{display:flex;gap:12px;align-items:flex-end}
.row input{text-transform:uppercase;letter-spacing:.3em;font-family:"Rozha One",Georgia,serif;font-size:24px}
.row .btn{flex:none}
.or{color:var(--mut);font-family:Kalam,cursive;font-size:18px;margin-top:6px}
.fine{font-size:13px;color:var(--mut)}

/* game layout */
.game{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto;background:linear-gradient(90deg,transparent 16px,var(--margin) 16px,var(--margin) 18px,transparent 18px)}
#hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 8px 30px;border-bottom:3px double var(--ink)}
#hdr .code{font-size:24px;letter-spacing:.14em;color:var(--acc)}
.rnd{margin-left:10px;font-family:Kalam,cursive;color:var(--mut)}
#hdr .h-r{display:flex;gap:8px}
.scroll{flex:1;overflow:auto;padding:4px 14px 14px 30px;-webkit-overflow-scrolling:touch}
.dock{padding:14px 14px calc(14px + env(safe-area-inset-bottom)) 30px;background:linear-gradient(transparent,var(--paper) 20%);display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.dock .wide,.dock .ask,.dock .note{grid-column:1/-1}
.note{font-family:Kalam,cursive;color:var(--mut);padding:4px 0;font-size:17px}
.ask{font-weight:700;padding:4px 0}
.row2{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* player rows */
.seats{display:flex;flex-direction:column}
.seat{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);position:relative;min-height:68px}
.seat.turn{border-bottom:3px solid var(--acc)}
.seat.turn::before{content:"\25B6";position:absolute;left:-22px;top:50%;translate:0 -50%;color:var(--acc);font-size:15px}
.seat.pk,.seat.out{opacity:.62}
.seat.pk .nm{text-decoration:line-through;text-decoration-thickness:2px}
.seat.win{background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--win) 16%,transparent))}
.nm{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{font-weight:400;color:var(--mut)}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:3px}
.ch{font-family:Kalam,cursive;font-size:18px;color:var(--acc);font-variant-numeric:tabular-nums}
.won{font-family:Kalam,cursive;font-size:18px;font-weight:700;color:var(--win)}
.stamp{display:inline-block;border:2px solid currentColor;border-radius:4px;padding:0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;rotate:-3deg;line-height:1.55}
.s-blind{color:var(--red)}.s-seen{color:var(--acc)}.s-pk,.s-out{color:var(--mut)}
.hn{font-size:13px;font-weight:700;color:var(--win);margin-top:2px}
.off{font-size:12px;color:var(--red);font-weight:700}
.dlr{display:inline-block;margin-left:6px;border:2px solid var(--acc);color:var(--acc);border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:700;text-align:center;line-height:16px;vertical-align:middle}
.seat .cards{display:flex;gap:3px}

/* cards */
.card{--w:68px;width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.09);background:var(--card);color:var(--cardink);border:max(1.5px,calc(var(--w)*.03)) solid #201710;position:relative;box-shadow:2px 2px 0 var(--shadow);flex:none;animation:pop .28s ease-out backwards}
.card.red{color:var(--cardred)}
.card i{position:absolute;top:calc(var(--w)*.06);left:calc(var(--w)*.09);font-style:normal;font-weight:700;font-size:calc(var(--w)*.3);line-height:1}
.card b{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w)*.52);padding-top:calc(var(--w)*.22);font-weight:400}
.card.sm{--w:32px}
.card.md{--w:46px}
.card.lg{--w:84px}
.card.back{background:radial-gradient(circle,#e9b04b 0 9%,transparent 10% 24%,#e9b04b 25% 28%,transparent 29%),repeating-linear-gradient(45deg,#7a2320 0 5px,#5f1a17 5px 10px);border:max(2px,calc(var(--w)*.06)) solid var(--card);outline:1px solid #201710;outline-offset:-1px}
@keyframes pop{from{opacity:0;translate:0 10px}}

/* centre */
.center{padding:18px 0 8px}
.pot-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.potl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:700}
.potv{font-size:58px;line-height:1.05;color:var(--acc);border-bottom:4px double var(--acc);display:inline-block;padding:0 6px 2px 0;font-variant-numeric:tabular-nums}
.stk{font-size:19px;text-align:right;line-height:1.3}
.bar{height:12px;border:2px solid var(--ink);margin-top:14px;background:repeating-linear-gradient(90deg,transparent 0 9px,var(--line) 9px 10px)}
.bar>div{height:100%;background:var(--gold);transition:width .3s}
.barl{font-size:12px;color:var(--mut);text-align:right;margin-top:2px}
.msg{color:var(--mut);font-size:18px;min-height:28px;margin-top:8px}
.res h2{font-size:32px;line-height:1.15;color:var(--win);margin-top:2px}
.res p{margin-top:6px;color:var(--mut)}
.reveal{display:flex;flex-direction:column;margin:14px 0 6px}
.rv{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.rv.win{border-bottom:3px solid var(--win)}
.rv .cards{display:flex;gap:4px}
.rv b{font-size:17px}

/* my hand */
.mine{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0 6px}
.hand{display:flex;gap:10px;cursor:pointer}
.hand .card:nth-child(1){rotate:-5deg}
.hand .card:nth-child(2){translate:0 -5px}
.hand .card:nth-child(3){rotate:5deg}
.mine.pk .hand{opacity:.55}
.hname{font-family:Kalam,cursive;font-size:20px;color:var(--acc);min-height:30px;text-align:center}

/* lobby */
.lobby{display:flex;flex-direction:column;gap:12px;padding-top:14px}
.slip{border:2px dashed var(--ink);padding:14px 16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--paper2)}
.slip .code{font-size:50px;letter-spacing:.14em;color:var(--acc);line-height:1.05}
.lbl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.plist,.kvs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li,.kv{display:flex;align-items:baseline;gap:8px;padding:8px 0}
.plist li{border-bottom:1px solid var(--line)}
.lead{flex:1;border-bottom:2px dotted var(--line);translate:0 -4px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none;align-self:center}
.dot.on{background:var(--win)}
.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;border:2px solid var(--acc);color:var(--acc);border-radius:4px;padding:0 5px}
.num{font-family:Kalam,cursive;font-size:18px;color:var(--acc)}
.x{border:0;background:none;color:var(--red);font-size:16px;cursor:pointer;padding:4px 8px;width:auto}

/* sheets */
#sheet{position:fixed;inset:0;background:rgba(10,6,3,.62);z-index:40;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sheet-in{background:repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 34px),var(--paper);width:100%;max-width:640px;max-height:88dvh;overflow:auto;border-radius:14px 14px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));border-top:5px double var(--ink);display:flex;flex-direction:column;gap:12px}
.sheet-in h2{font-size:28px;color:var(--acc)}
.field{display:flex;flex-direction:column;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rank{counter-reset:r;list-style:none;margin:0;padding:0}
.rank li{counter-increment:r;display:grid;grid-template-columns:30px 1fr;gap:8px;padding:8px 0;border-bottom:1px dotted var(--line)}
.rank li::before{content:counter(r);color:var(--acc);font-size:22px;line-height:1.2}
.hn2{font-size:18px}
.hist p{font-size:17px;padding-bottom:6px;border-bottom:1px dotted var(--line);margin-bottom:6px}
.ssr{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.ssr>div{display:flex;flex-direction:column;align-items:center;gap:6px}
.ssr .cards{display:flex;gap:4px}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<div id="conn"></div>
<main id="app"></main>
<div id="sheet" hidden></div>
<div id="toast"></div>

<script>
(()=>{
'use strict';

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const uid=()=>Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6);
const genCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[rnd(a.length)];return s};
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function setHTML(el,h){if(el&&el._h!==h){el.innerHTML=h;el._h=h}}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
function setConn(m){const c=$('#conn');c.innerHTML=m?esc(m)+(view?'':' <button class="cx" data-a="cancel">Cancel</button>'):'';c.classList.toggle('on',!!m)}

/* ---------- prefs ---------- */
const prefs=Object.assign({theme:'dark',sound:true,vib:true},LS.get('tp_prefs',{}));
const savePrefs=()=>{LS.set('tp_prefs',prefs);document.documentElement.dataset.theme=prefs.theme};
savePrefs();
let ac;
function beep(f=660,d=.12,type='sine',v=.07){
  if(!prefs.sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);
    o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d);
  }catch(e){}
}
const vib=p=>{if(prefs.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};

/* ---------- cards and hands ---------- */
const SUIT={S:'\u2660',H:'\u2665',D:'\u2666',C:'\u2663'};
const RK={11:'J',12:'Q',13:'K',14:'A'};
const FULL={11:'Jack',12:'Queen',13:'King',14:'Ace'};
const rk=r=>RK[r]||String(r);
const plural=r=>(FULL[r]||String(r))+'s';
function makeDeck(){const d=[];for(const s of 'SHDC')for(let r=2;r<=14;r++)d.push({r,s});return d}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function evalHand(h){
  const r=h.map(c=>c.r).sort((a,b)=>b-a);
  const flush=h.every(c=>c.s===h[0].s);
  let run=false,rv=0,back=false;
  if(r[0]===r[1]+1&&r[1]===r[2]+1){run=true;rv=r[0]}
  else if(r[0]===14&&r[1]===3&&r[2]===2){run=true;rv=15}
  else if(r[0]===12&&r[1]===10&&r[2]===9){run=true;rv=11.5;back=true}
  const seq=rv===15?'A 2 3':r.map(rk).join(' ');
  if(r[0]===r[1]&&r[1]===r[2])return{k:[8,r[0]],n:'Trail of '+plural(r[0])};
  if(r[0]===5&&r[1]===3&&r[2]===2)return flush?{k:[7],n:'Raj Kapoor 2 3 5, same suit'}:{k:[5],n:'Raj Kapoor 2 3 5'};
  if(run&&flush)return{k:[6,rv],n:(back?'Pure Backshow (':'Pure Run (')+seq+')'};
  if(run)return{k:[4,rv],n:(back?'Backshow (':'Run (')+seq+')'};
  if(flush)return{k:[3,...r],n:'Color, '+(FULL[r[0]]||r[0])+' high'};
  if(r[0]===r[1]||r[1]===r[2]){const k=r[0]===r[1]?r[2]:r[0];return{k:[2,r[1],k],n:'Pair of '+plural(r[1])}}
  return{k:[1,...r],n:(FULL[r[0]]||r[0])+' high'};
}
function cmp(a,b){for(let i=0;i<Math.max(a.k.length,b.k.length);i++){const d=(a.k[i]||0)-(b.k[i]||0);if(d)return d}return 0}

/* ---------- identity and state ---------- */
const me={pid:LS.get('tp_pid',null)||uid(),name:LS.get('tp_name','')};
LS.set('tp_pid',me.pid);
let role=null,code='',peer=null,conn=null,conns={},G=null,view=null,screen='',retryT=null,attemptT=null,joinTries=0,autoJoin=false,hostFresh=false,prev={},ssSeen='';
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun2.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}];
/* For networks that block direct connections, add a TURN server here:
   ICE.push({urls:'turn:YOUR_HOST:3478',username:'USER',credential:'PASS'}); */
const PEER_OPTS={config:{iceServers:ICE}};
function resetNet(){role=null;clearTimeout(retryT);retryT=null;clearTimeout(attemptT);attemptT=null;destroyPeer();conns={};setConn('')}
function destroyPeer(){if(peer){try{peer.destroy()}catch(e){}peer=null}conn=null}

/* ---------- host: game engine ---------- */
function newG(){
  return{code,hostPid:me.pid,settings:{maxPlayers:6,boot:5,chips:10000,potLimit:5000,maxBlind:4},
    players:[{id:me.pid,name:me.name,chips:10000,connected:true}],phase:'lobby',dealer:-1,round:null,history:[],rn:0};
}
const P=id=>G.players.find(p=>p.id===id);
const nmOf=id=>{const p=P(id);return p?p.name:'?'};
const seatIdx=id=>G.players.findIndex(p=>p.id===id);
const activeIds=()=>G.players.filter(p=>G.round.st[p.id]==='active').map(p=>p.id);
function nextActive(id){const n=G.players.length;let i=seatIdx(id);for(let k=0;k<n;k++){i=(i+1)%n;if(G.round.st[G.players[i].id]==='active')return G.players[i].id}return id}
function prevActive(id){const n=G.players.length;let i=seatIdx(id);for(let k=0;k<n;k++){i=(i-1+n)%n;if(G.round.st[G.players[i].id]==='active')return G.players[i].id}return id}
const say=m=>{const L=G.round.log;L.push(m);if(L.length>60)L.shift()};
const pay=(p,c)=>{p.chips-=c;G.round.pot+=c};

function startRound(){
  const S=G.settings;
  const el=G.players.filter(p=>p.connected&&p.chips>=S.boot);
  if(el.length<2){toast('Need 2 or more connected players with enough chips');return false}
  const n=G.players.length;let d=G.dealer;
  do{d=(d+1)%n}while(!el.includes(G.players[d]));
  G.dealer=d;
  const deck=shuffle(makeDeck());
  const R={n:++G.rn,hands:{},st:{},seen:{},blind:{},stake:S.boot,bets:0,dealt:el.length,boot:S.boot,pot:0,turn:null,ss:null,ssRev:null,ssId:0,log:[],result:null};
  G.players.forEach(p=>{
    if(el.includes(p)){
      p.chips-=S.boot;R.pot+=S.boot;
      R.hands[p.id]=[deck.pop(),deck.pop(),deck.pop()];
      R.st[p.id]='active';R.seen[p.id]=false;R.blind[p.id]=0;
    }else R.st[p.id]='out';
  });
  G.round=R;G.phase='playing';
  say('Round '+R.n+': boot '+S.boot+' from '+el.length+' players');
  R.turn=nextActive(G.players[d].id);
  beginTurn();
  broadcast();
  return true;
}
function beginTurn(){
  const R=G.round,id=R.turn;
  if(!R.seen[id]&&R.blind[id]>=G.settings.maxBlind){R.seen[id]=true;say(nmOf(id)+' played '+G.settings.maxBlind+' blind rounds and must look at the cards')}
}
function actionsFor(pid){
  const A={};
  if(G.phase!=='playing')return A;
  const R=G.round;
  if(R.st[pid]!=='active')return A;
  const p=P(pid);
  if(!R.seen[pid])A.see=true;
  if(R.ss){if(R.ss.to===pid)A.answer={from:R.ss.from};else A.wait=true;return A}
  if(R.turn!==pid)return A;
  A.turn=true;
  const seen=R.seen[pid];
  const cc=seen?R.stake*2:R.stake;
  A.chaal={cost:cc,ok:p.chips>=cc};
  const rlo=Math.min(R.stake+5,R.stake*2),rhi=Math.min(R.stake*2,Math.floor(p.chips/(seen?2:1)));
  A.raise={lo:rlo,hi:rhi,ok:rhi>=rlo};
  const n=activeIds().length;
  if(n===2){
    const both=activeIds().every(id=>R.seen[id]);
    const late=R.bets>=R.dealt;
    A.show={cost:Math.min(cc,p.chips),ok:both&&late,why:!both?'both players must have seen their cards':(!late?'not allowed in the first round of betting':'')};
  }
  if(n>=3&&seen){const pv=prevActive(pid);if(pv!==pid&&R.seen[pv])A.side={cost:cc,ok:p.chips>=cc,with:nmOf(pv)}}
  return A;
}
function hostAct(pid,a,v){doAct(pid,a,v);broadcast()}
function doAct(pid,a,v){
  if(G.phase!=='playing')return;
  const R=G.round,S=G.settings,p=P(pid);
  if(!p||R.st[pid]!=='active')return;
  if(a==='see'){if(!R.seen[pid]){R.seen[pid]=true;say(p.name+' looked at the cards')}return}
  if(R.ss){if(pid===R.ss.to&&(a==='ss_accept'||a==='ss_decline'))resolveSS(a==='ss_accept');return}
  if(R.turn!==pid)return;
  R.ssRev=null;
  const A=actionsFor(pid),seen=R.seen[pid];
  if(a==='pack'){packOut(pid);return}
  if(a==='chaal'&&A.chaal&&A.chaal.ok){
    pay(p,A.chaal.cost);R.bets++;if(!seen)R.blind[pid]++;
    say(p.name+(seen?' chaal ':' blind chaal ')+fmt(A.chaal.cost));afterBet();return;
  }
  if(a==='raise'&&A.raise&&A.raise.ok){
    v=Math.floor(+v);
    if(!(v>=A.raise.lo&&v<=A.raise.hi))return;
    const rc=seen?v*2:v;
    R.stake=v;pay(p,rc);R.bets++;if(!seen)R.blind[pid]++;
    say(p.name+(seen?' raised the stake to ':' blind raised the stake to ')+fmt(v)+' ('+fmt(rc)+')');afterBet();return;
  }
  if(a==='show'&&A.show&&A.show.ok){
    pay(p,A.show.cost);say(p.name+' asked for a show ('+fmt(A.show.cost)+')');showdown('Show');return;
  }
  if(a==='side'&&A.side&&A.side.ok){
    pay(p,A.side.cost);R.bets++;R.ss={from:pid,to:prevActive(pid)};
    say(p.name+' asks '+nmOf(R.ss.to)+' for a side show ('+fmt(A.side.cost)+')');
    if(R.pot>=S.potLimit){R.ss=null;showdown('Pot limit reached')}
    return;
  }
}
function afterBet(){
  const R=G.round;
  if(R.pot>=G.settings.potLimit){showdown('Pot limit reached');return}
  R.turn=nextActive(R.turn);beginTurn();
}
function packOut(pid){
  const R=G.round;
  R.st[pid]='packed';say(nmOf(pid)+' packed');
  if(checkEnd())return;
  if(R.turn===pid){R.turn=nextActive(pid);beginTurn()}
}
function checkEnd(){const ids=activeIds();if(ids.length===1){finish([ids[0]],false,'Everyone else packed');return true}return false}
function resolveSS(accept){
  const R=G.round,{from,to}=R.ss;R.ss=null;
  if(!accept){say(nmOf(to)+' declined the side show');R.turn=nextActive(from);beginTurn();return}
  const a=evalHand(R.hands[from]),b=evalHand(R.hands[to]);
  const loser=cmp(a,b)>0?to:from;
  R.st[loser]='packed';
  R.ssRev={id:++R.ssId,pids:[from,to],loser,hands:{[from]:{cards:R.hands[from],name:a.n},[to]:{cards:R.hands[to],name:b.n}}};
  say('Side show: '+nmOf(from)+' vs '+nmOf(to)+', '+nmOf(loser)+' packed');
  if(checkEnd())return;
  R.turn=nextActive(from);beginTurn();
}
function showdown(reason){
  const R=G.round,ids=activeIds();
  const ev=ids.map(id=>({id,e:evalHand(R.hands[id])}));
  let best=ev[0];ev.forEach(x=>{if(cmp(x.e,best.e)>0)best=x});
  const winners=ev.filter(x=>cmp(x.e,best.e)===0).map(x=>x.id);
  finish(winners,true,reason);
}
function finish(winners,reveal,reason){
  const R=G.round;
  const refunds=[];
  Object.keys(R.hands).forEach(id=>{if(evalHand(R.hands[id]).k.join()==='1,6,3,2'&&P(id)){refunds.push({id,amt:R.boot});P(id).chips+=R.boot}});
  const potLeft=R.pot-refunds.length*R.boot;
  const share=Math.floor(potLeft/winners.length),rem=potLeft-share*winners.length;
  winners.forEach((id,i)=>{P(id).chips+=share+(i===0?rem:0)});
  const hands={};
  if(reveal)activeIds().forEach(id=>{hands[id]={cards:R.hands[id],name:evalHand(R.hands[id]).n}});
  R.result={winners,share,reveal,reason,hands,pot:potLeft,refunds,at:Date.now()};
  G.phase='roundEnd';
  refunds.forEach(f=>say(nmOf(f.id)+' held 2 3 6, the lowest hand, and got the boot back ('+fmt(f.amt)+')'));
  const line='Round '+R.n+': '+winners.map(nmOf).join(' and ')+' won '+fmt(potLeft)+(reveal?' with '+hands[winners[0]].name:'');
  say(line);G.history.push(line);if(G.history.length>40)G.history.shift();
}
function hostCtl(c,d){
  if(role!=='host')return;
  if(c==='start'){if(G.phase==='lobby'||G.phase==='roundEnd')startRound();return}
  if(c==='force'&&G.phase==='playing'){
    const R=G.round;
    if(R.ss){const t=P(R.ss.to);if(t&&!t.connected)resolveSS(false)}
    else{const t=P(R.turn);if(t&&!t.connected)packOut(R.turn)}
  }
  if(c==='reset'&&G.phase!=='playing'){
    G.players.forEach(p=>p.chips=G.settings.chips);G.phase='lobby';G.round=null;G.dealer=-1;G.history.push('Chips reset to '+fmt(G.settings.chips));
  }
  if(c==='lobby'&&G.phase==='roundEnd'){G.phase='lobby';G.round=null}
  if(c==='kick'&&G.phase!=='playing'&&d!==me.pid){
    const idx=seatIdx(d);
    if(idx>=0){
      const k=conns[d];if(k){try{k.send({t:'kick'})}catch(e){}setTimeout(()=>{try{k.close()}catch(e){}},250);delete conns[d]}
      G.players.splice(idx,1);if(idx<=G.dealer)G.dealer--;
    }
  }
  if(c==='settings'){
    if(G.phase==='playing'){toast('Change settings between rounds');return}
    const mp=clamp(+d.maxPlayers|0,2,17);
    if(mp<G.players.length){toast('Max players is lower than the players seated');return}
    const boot=Math.max(1,+d.boot|0),chips=Math.max(boot*5,+d.chips|0),pl=Math.max(boot*4,+d.potLimit|0),mb=clamp(+d.maxBlind|0,1,20);
    G.settings={maxPlayers:mp,boot,chips,potLimit:pl,maxBlind:mb};
    toast('Settings saved');
  }
  broadcast();
}
function makeView(pid){
  const R=G.round,S=G.settings;
  const v={code:G.code,phase:G.phase,settings:S,me:pid,hostPid:G.hostPid,
    dealer:G.dealer>=0&&G.players[G.dealer]?G.players[G.dealer].id:null,
    players:G.players.map(p=>({id:p.id,name:p.name,chips:p.chips,connected:p.connected,st:R?(R.st[p.id]||'out'):'out',seen:R?!!R.seen[p.id]:false})),
    hist:G.history.slice(-30),acts:{},round:null,myCards:null,myName:null,ssRev:null};
  if(R){
    v.round={n:R.n,pot:R.pot,stake:R.stake,turn:R.turn,ss:R.ss,result:R.result,log:R.log.slice(-40)};
    if(R.hands[pid]&&(R.seen[pid]||G.phase==='roundEnd')){v.myCards=R.hands[pid];v.myName=evalHand(R.hands[pid]).n}
    v.acts=actionsFor(pid);
    if(R.ssRev&&R.ssRev.pids.includes(pid))v.ssRev=R.ssRev;
  }
  return v;
}
function broadcast(){
  if(role!=='host'||!G)return;
  LS.set('tp_G',G);
  LS.set('tp_session',{role:'host',code:G.code,name:me.name,at:Date.now()});
  G.players.forEach(p=>{
    if(p.id===me.pid)view=makeView(p.id);
    else{const c=conns[p.id];if(c&&c.open){try{c.send({t:'state',s:makeView(p.id)})}catch(e){}}}
  });
  onView();
}

/* ---------- host: networking ---------- */
function hostStart(resume){
  role='host';
  if(resume){G=resume;G.players.forEach(p=>{if(p.id!==me.pid)p.connected=false});code=G.code;hostFresh=false}
  else{code=genCode();G=newG();hostFresh=true}
  openHostPeer(0);
}
function openHostPeer(tries){
  destroyPeer();
  setConn('Opening room...');
  const pr=new Peer('tpatti-'+code,PEER_OPTS);
  peer=pr;
  pr.on('open',()=>{
    setConn('');hostFresh=false;
    LS.set('tp_session',{role:'host',code,name:me.name,at:Date.now()});
    broadcast();
  });
  pr.on('connection',c=>{
    c.on('data',m=>hostMsg(c,m));
    c.on('close',()=>hostDrop(c));
    c.on('error',()=>hostDrop(c));
  });
  pr.on('disconnected',()=>{try{pr.reconnect()}catch(e){}});
  pr.on('error',e=>{
    if(peer!==pr)return;
    if(e.type==='unavailable-id'){
      if(hostFresh){code=genCode();G.code=code;openHostPeer(tries+1)}
      else if(tries<10)setTimeout(()=>{if(role==='host')openHostPeer(tries+1)},3000);
      else{toast('Room ID is still in use. Leave and create a new room.');setConn('')}
    }else if(['network','server-error','socket-error','socket-closed','disconnected'].includes(e.type)){
      setConn('Connection problem, retrying...');
      setTimeout(()=>{if(role==='host'&&peer===pr)openHostPeer(tries+1)},3000);
    }
  });
}
function hostMsg(c,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='join'&&typeof m.pid==='string'){
    let p=G.players.find(x=>x.id===m.pid);
    if(!p){
      if(G.players.length>=G.settings.maxPlayers){try{c.send({t:'full'})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},300);return}
      p={id:m.pid,name:cleanName(m.name),chips:G.settings.chips,connected:true};G.players.push(p);
    }else p.connected=true;
    const old=conns[p.id];
    if(old&&old!==c){try{old.close()}catch(e){}}
    conns[p.id]=c;c._pid=p.id;
    broadcast();return;
  }
  if(m.t==='act'&&c._pid&&typeof m.a==='string')hostAct(c._pid,m.a,m.v);
}
function hostDrop(c){
  const pid=c._pid;
  if(pid&&conns[pid]===c){delete conns[pid];const p=P(pid);if(p)p.connected=false;broadcast()}
}
const cleanName=n=>(String(n||'').trim().slice(0,14))||'Player';

/* ---------- client networking ---------- */
function clientStart(c,auto){
  role='client';code=c;joinTries=0;autoJoin=!!auto;
  openClientPeer();
}
function openClientPeer(){
  destroyPeer();
  setConn(view?'Reconnecting...':'Joining room...');
  const pr=new Peer(undefined,PEER_OPTS);peer=pr;
  clearTimeout(attemptT);
  attemptT=setTimeout(()=>{
    if(role!=='client'||peer!==pr)return;
    if(view&&conn&&conn.open)return;
    scheduleRetry(true);
  },12000);
  pr.on('open',()=>{
    const cn=pr.connect('tpatti-'+code,{reliable:true});
    conn=cn;
    cn.on('open',()=>{
      setConn('');
      cn.send({t:'join',pid:me.pid,name:me.name});
    });
    cn.on('data',onClientData);
    cn.on('close',()=>{if(conn===cn)scheduleRetry()});
    cn.on('error',()=>{if(conn===cn)scheduleRetry()});
  });
  pr.on('error',e=>{
    if(peer!==pr)return;
    if(e.type==='peer-unavailable'&&!view&&!autoJoin){toast('Room not found. Check the code.');leave();return}
    scheduleRetry();
  });
}
function scheduleRetry(now){
  if(role!=='client'||(retryT&&!now))return;
  if(!view){
    joinTries++;
    if(joinTries>(autoJoin?10:2)){toast(autoJoin?'The previous room is gone.':'Could not connect. Check the code or try a different network.');leave();return}
  }
  setConn(view?'Reconnecting...':'Joining room...');
  clearTimeout(retryT);
  retryT=setTimeout(()=>{retryT=null;if(role==='client')openClientPeer()},now?0:2000);
}
function onClientData(m){
  if(!m)return;
  if(m.t==='state'){clearTimeout(attemptT);joinTries=0;view=m.s;LS.set('tp_session',{role:'client',code,name:me.name,at:Date.now()});onView()}
  else if(m.t==='full'){toast('This room is full');leave(true)}
  else if(m.t==='kick'){toast('The host removed you');leave(true)}
  else if(m.t==='closed'){toast('The host closed the room');leave(true)}
}
function act(a,v){
  if(role==='host')hostAct(me.pid,a,v);
  else if(conn&&conn.open)conn.send({t:'act',a,v});
  else toast('Not connected');
}
function leave(silent){
  if(role==='host'){Object.values(conns).forEach(c=>{try{c.send({t:'closed'})}catch(e){}})}
  const wasHost=role==='host';
  role=null;view=null;G=null;conns={};prev={};
  clearTimeout(retryT);retryT=null;clearTimeout(attemptT);attemptT=null;
  LS.del('tp_session');LS.del('tp_G');
  setTimeout(destroyPeer,wasHost?300:0);
  setConn('');closeSheet();showHome();
}

/* ---------- view effects ---------- */
function onView(){
  const A=view.acts||{};
  const R=view.round;
  if(A.turn&&!prev.turn){beep(880,.16);vib(90)}
  if(A.answer&&!prev.ans){beep(520,.22);vib([60,60,60])}
  if(R&&prev.pot!=null&&R.n===prev.n&&R.pot>prev.pot)beep(420,.07,'triangle');
  if(view.phase==='playing'&&prev.phase!=='playing')beep(600,.12);
  if(view.phase==='roundEnd'&&prev.phase==='playing'){
    const won=R.result.winners.includes(view.me);
    beep(won?988:300,.4);vib(won?[80,60,80]:40);
  }
  prev={turn:!!A.turn,ans:!!A.answer,pot:R?R.pot:null,n:R?R.n:null,phase:view.phase};
  render();
  if(view.ssRev&&R){
    const key=R.n+'-'+view.ssRev.id;
    if(key!==ssSeen){ssSeen=key;openSheet(ssHTML())}
  }
}

function cardH(c,cls=''){const red=c.s==='H'||c.s==='D';return'<div class="card '+(red?'red ':'')+cls+'"><i>'+rk(c.r)+'</i><b>'+SUIT[c.s]+'</b></div>'}

function seatH(p){
  const R=view.round,res=R.result,you=p.id===view.me;
  const turn=view.phase==='playing'&&R.turn===p.id&&!R.ss;
  const win=res&&res.winners.includes(p.id);

  else if(p.st==='out'){badge=p.chips<view.settings.boot?'Out of chips':'Sitting out';key='out'}
  else{badge=p.seen?'Seen':'Blind';key=p.seen?'seen':'blind'}
  let cards='';

  if(rv)cards=rv.cards.map(c=>cardH(c,'sm')).join('');
  else if(p.st==='active'||p.st==='packed')cards=backH('sm')+backH('sm')+backH('sm');
  return'<div class="'+cls+'"><div class="info"><div class="nm">'+esc(p.name)+(you?' <small>(you)</small>':'')+(view.dealer===p.id?'<span class="dlr" title="Dealer">D</span>':'')+'</div>'+
  '<div class="meta"><span class="stamp s-'+key+'">'+badge+'</span><span class="ch">'+fmt(p.chips)+'</span>'+(win?'<span class="won">+'+fmt(res.share)+'</span>':'')+(!p.connected?'<span class="off">offline</span>':'')+'</div>'+
  (rv?'<div class="hn">'+esc(rv.name)+'</div>':'')+'</div><div class="cards">'+cards+'</div></div>';

const REVEAL_MS=10000;
let lockT=null;
function lockLeft(){
  const r=view&&view.round&&view.round.result;
  if(!r||!r.reveal||!r.at)return 0;
  return Math.max(0,Math.ceil((r.at+REVEAL_MS-Date.now())/1000));
}
function centerH(){
  const R=view.round,S=view.settings;
  if(view.phase==='roundEnd'&&R.result){
    const r=R.result;
    const ids=Object.keys(r.hands||{}).sort((a,b)=>(r.winners.includes(b)?1:0)-(r.winners.includes(a)?1:0));
    const rv=ids.map(id=>{const x=r.hands[id];return'<div class="rv'+(r.winners.includes(id)?' win':'')+'"><div class="cards">'+x.cards.map(c=>cardH(c,'md')).join('')+'</div><div><b>'+esc(nameOf(id))+'</b><br><span class="mut">'+esc(x.name)+'</span></div></div>'}).join('');
    const rf=(r.refunds||[]).map(f=>'<p>'+esc(nameOf(f.id))+' held 2 3 6, the lowest hand, and got the boot back ('+fmt(f.amt)+').</p>').join('');
    return'<div class="center res"><div class="potl">Round '+R.n+' result</div><h2>'+esc(r.winners.map(nameOf).join(' and '))+' won '+fmt(r.share)+(r.winners.length>1?' each':'')+'</h2><p>'+esc(r.reason)+'</p>'+(rv?'<div class="reveal">'+rv+'</div>':'')+rf+'</div>';
  }
  const last=R.log.length?R.log[R.log.length-1]:'';
  const pct=clamp(R.pot/S.potLimit*100,0,100);
  return'<div class="center"><div class="pot-row"><div><div class="potl">Pot</div><div class="potv">'+fmt(R.pot)+'</div></div><div class="stk">Blind '+fmt(R.stake)+'<br>Seen '+fmt(R.stake*2)+'</div></div>'+
  '<div class="bar"><div style="width:'+pct+'%"></div></div><div class="barl">Pot limit '+fmt(S.potLimit)+'</div>'+
  '<div class="msg">'+esc(last)+'</div></div>';
}
function mineH(){
  const me=view.players.find(p=>p.id===view.me);
  if(!me)return'';
  if(me.st==='out')return'<div class="mine"><div class="mut">You sit out this round and join the next one.</div></div>';
  const seen=!!view.myCards;
  const cards=seen?view.myCards.map(c=>cardH(c,'lg')).join(''):backH('lg')+backH('lg')+backH('lg');
  return'<div class="mine '+(me.st==='packed'?'pk':'')+'"><div class="hand" '+(seen?'':'data-a="see"')+'>'+cards+'</div><div class="hname">'+(seen?esc(view.myName):(me.st==='active'&&view.phase==='playing'?'Playing blind. Tap the cards to look.':''))+'</div></div>';
}
function dockH(){
  const host=view.me===view.hostPid,A=view.acts||{},R=view.round;
  if(view.phase==='lobby'){
    const ready=view.players.filter(p=>p.connected).length>=2;
    return host
      ?'<button class="btn primary wide" data-a="start" '+(ready?'':'disabled')+'>'+(ready?'Start game':'Waiting for a second player')+'</button><button class="btn wide" data-a="settings">Table settings</button>'
      :'<div class="note">Waiting for the host to start the game</div>';
  }
  if(view.phase==='roundEnd'){
    const can=view.players.filter(p=>p.connected&&p.chips>=view.settings.boot).length>=2;
    const lk=host?lockLeft():0;
    if(!host)return'<div class="note">'+(can?'Waiting for the host to deal the next round':'Not enough players with chips left')+'</div>';
    return can
      ?'<button class="btn primary wide" data-a="start" '+(lk?'disabled':'')+'>Next round'+(lk?' ('+lk+')':'')+'</button><button class="btn" data-a="settings">Settings</button><button class="btn" data-a="reset">Reset chips</button>'
      :'<div class="note">Not enough players with chips left. Reset chips to play on.</div><button class="btn primary wide" data-a="reset">Reset chips</button>';
  }
  const meP=view.players.find(p=>p.id===view.me);
  if(A.answer)return'<div class="ask">'+esc(nameOf(A.answer.from))+' asks you for a side show. Compare cards?</div><div class="row2"><button class="btn primary" data-a="ss_accept">Accept</button><button class="btn" data-a="ss_decline">Decline</button></div>';
  let h='';
  if(A.turn){
    if(A.see)h+='<button class="btn wide" data-a="see">Look at cards</button>';
    h+='<button class="btn primary" data-a="chaal" '+(A.chaal.ok?'':'disabled')+'>Chaal '+fmt(A.chaal.cost)+'</button>';
    h+='<button class="btn" data-a="raise" '+(A.raise.ok?'':'disabled')+'>Raise stake</button>';
    if(A.side)h+='<button class="btn" data-a="side" '+(A.side.ok?'':'disabled')+'>Side show '+fmt(A.side.cost)+'</button>';
    if(A.show)h+='<button class="btn" data-a="show" '+(A.show.ok?'':'disabled')+'>Show '+fmt(A.show.cost)+'</button>';
    h+='<button class="btn danger" data-a="pack">Pack</button>';
    if(A.show&&!A.show.ok)h+='<div class="note">Show is locked: '+A.show.why+'.</div>';
    return h;
  }
  if(A.see)h+='<button class="btn wide" data-a="see">Look at cards</button>';
  let note='';
  if(!meP||meP.st==='out')note='You sit out this round';
  else if(meP.st==='packed')note='You packed. Watching the rest.';
  else if(R.ss)note=nameOf(R.ss.from)+' asked '+nameOf(R.ss.to)+' for a side show';
  else note='Waiting for '+nameOf(R.turn);
  h+='<div class="note">'+esc(note)+'</div>';
  if(host){
    const tid=R.ss?R.ss.to:R.turn,t=view.players.find(p=>p.id===tid);
    if(t&&!t.connected&&t.id!==view.me)h+='<button class="btn wide" data-a="force">'+(R.ss?'Skip':'Pack for')+' '+esc(t.name)+' (offline)</button>';
  }
  return h;
}

/* ---------- sheets ---------- */
function openSheet(h){const s=$('#sheet');s.innerHTML='<div class="sheet-in">'+h+'</div>';s.hidden=false}
function closeSheet(){const s=$('#sheet');s.hidden=true;s.innerHTML=''}
function ssHTML(){
  const r=view.ssRev;
  const col=id=>{const x=r.hands[id];return'<div><b>'+esc(nameOf(id))+'</b><div class="cards">'+x.cards.map(c=>cardH(c,'sm')).join('')+'</div><span class="mut">'+esc(x.name)+'</span></div>'};
  return'<h2>Side show</h2><div class="ssr">'+r.pids.map(col).join('')+'</div><p style="text-align:center;margin:0"><b>'+esc(nameOf(r.loser))+'</b> packed.</p><button class="btn primary" data-a="close">Continue</button>';
}
function rulesH(){
  const li=(n,t)=>'<li><div><span class="hn2">'+n+'</span> '+t+'</div></li>';
  return'<h2>Hand ranking</h2><p class="mut">Best first.</p><ol class="rank">'+
  li('Trail','Three cards of one rank. Aces are highest.')+
  li('Raj Kapoor, one suit','The 2, 3 and 5 of the same suit. Beats every pure run, loses to a trail.')+
  li('Pure run','Three in a row, all of one suit.')+
  li('Raj Kapoor, mixed suits','The 2, 3 and 5 in different suits. Beats every ordinary run.')+
  li('Run','Three in a row, mixed suits.')+
  li('Color','Three cards of one suit, not in a row.')+
  li('Pair','Two cards of one rank.')+
  li('High card','Anything else.')+
  '</ol>'+
  '<p>Runs rank A 2 3 highest, then A K Q, then down to 4 3 2. Equal hands split the pot.</p>'+
  '<p>Backshow is 9 10 Q. It counts as a run that beats 9 10 J and everything below it, and loses to 10 J Q and above. In one suit it ranks the same way among pure runs, so it also beats every mixed run.</p>'+
  '<p>A player dealt 2 3 6 in mixed suits, the lowest possible hand, gets the boot back from the pot.</p>'+
  '<h2>Betting</h2>'+
  '<p>A blind player has not looked at their cards and pays the stake. Once you look you play seen and pay double.</p>'+
  '<p>Chaal pays that amount and passes the turn. Raise lets you type a new stake, from 5 above the current stake up to double it. Pack folds your hand.</p>'+
  '<p>Show needs exactly two players left, both seen, after the first round of betting. Both hands turn over and the higher one wins.</p>'+
  '<p>A seen player can ask for a side show with the seen player before them. The two compare cards privately and the lower hand packs. If they tie, the asker packs.</p>'+
  '<p>When the pot reaches the table limit, everyone still in shows their hand.</p>'+
  '<button class="btn primary" data-a="close">Close</button>';
}
function settingsH(){
  const S=view.settings,host=view.me===view.hostPid;
  const f=(id,l,v)=>'<label class="field">'+l+'<input id="'+id+'" type="number" inputmode="numeric" min="1" value="'+v+'" '+(host?'':'disabled')+'></label>';
  return'<h2>Table settings</h2>'+
  f('s_max','Max players (2 to 17)',S.maxPlayers)+f('s_boot','Boot amount',S.boot)+
  f('s_chips','Starting chips (new players and chip reset)',S.chips)+f('s_pot','Pot limit',S.potLimit)+f('s_blind','Max blind rounds per player',S.maxBlind)+
  (host?'<button class="btn primary" data-a="savesettings">Save</button>':'<p class="mut" style="margin:0">Only the host can change settings.</p>')+
  '<button class="btn" data-a="close">Close</button>';
}
function histH(){
  const cur=view.round&&view.phase==='playing'?view.round.log.slice().reverse():[];
  const old=view.hist.slice().reverse();
  const p=a=>a.map(x=>'<p>'+esc(x)+'</p>').join('');
  return'<h2>History</h2><div class="hist">'+(cur.length?'<h3>This round</h3>'+p(cur):'')+(old.length?'<h3>Finished rounds</h3>'+p(old):'')+(!cur.length&&!old.length?'<p class="mut">Nothing yet.</p>':'')+'</div><button class="btn primary" data-a="close">Close</button>';
}
function menuH(){
  const host=view.me===view.hostPid;
  return'<h2>Menu</h2><div class="menu">'+
  '<button class="btn" data-a="settings">Settings</button><button class="btn" data-a="history">History</button>'+
  '<button class="btn" data-a="rules">Rules</button><button class="btn" data-a="theme">Theme: '+prefs.theme+'</button>'+
  '<button class="btn" data-a="sound">Sound: '+(prefs.sound?'on':'off')+'</button><button class="btn" data-a="vib">Vibration: '+(prefs.vib?'on':'off')+'</button>'+
  (host&&view.phase==='roundEnd'?'<button class="btn" data-a="tolobby">Back to lobby</button>':'')+
  '<button class="btn danger" data-a="leave">'+(host?'Close room':'Leave room')+'</button></div><button class="btn primary" data-a="close">Close</button>';
}

/* ---------- events ---------- */
let raiseCtx=null;
function openRaise(){
  const A=view.acts&&view.acts.raise,mp=view.players.find(p=>p.id===view.me);
  if(!A||!mp)return;
  raiseCtx={lo:A.lo,hi:A.hi,seen:mp.seen,chips:mp.chips};
  openSheet('<h2>Raise the stake</h2><p class="mut" style="margin:0">The current stake is '+fmt(view.round.stake)+'. Type a new stake from '+fmt(A.lo)+' to '+fmt(A.hi)+'.</p>'+
    '<label class="field">New stake<input id="r_val" type="number" inputmode="numeric" min="'+A.lo+'" max="'+A.hi+'" value="'+A.lo+'"></label>'+
    '<div class="mut" id="r_cost"></div>'+
    '<div class="row2"><button class="btn" data-a="rmin">Minimum</button><button class="btn" data-a="rmax">Maximum</button></div>'+
    '<button class="btn primary" data-a="raiseconfirm">Raise</button><button class="btn" data-a="close">Cancel</button>');
  raiseCost();
}
function raiseCost(){
  const i=$('#r_val'),o=$('#r_cost');if(!i||!o||!raiseCtx)return;
  const v=Math.floor(+i.value)||0,c=raiseCtx.seen?v*2:v;
  o.textContent='You pay '+fmt(c)+(raiseCtx.seen?' (seen players pay double)':'')+'. You have '+fmt(raiseCtx.chips)+'.';
}
document.addEventListener('input',e=>{if(e.target.id==='r_val')raiseCost()});
function share(){
  const url=location.href.split('?')[0].split('#')[0]+'?room='+(view?view.code:code);
  if(navigator.share){navigator.share({title:'Teen Patti',text:'Join my Teen Patti table',url}).catch(()=>{})}
  else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('Invite link copied')).catch(()=>prompt('Copy this link',url));
  else prompt('Copy this link',url);
}
function readName(){
  const n=cleanName($('#nm')&&$('#nm').value);
  if(!$('#nm')||!$('#nm').value.trim()){toast('Enter your name first');return null}
  me.name=n;LS.set('tp_name',n);return n;
}
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;
  switch(a){
    case'create':if(readName()){resetNet();hostStart(null)}break;
    case'join':{
      if(!readName())break;
      const c=($('#cd').value||'').trim().toUpperCase();
      if(c.length!==5){toast('Enter the 5 character room code');break}
      resetNet();clientStart(c,false);break;
    }
    case'see':case'chaal':case'pack':case'show':case'side':case'ss_accept':case'ss_decline':act(a);break;
    case'raise':openRaise();break;
    case'rmin':case'rmax':{const i=$('#r_val');if(i&&raiseCtx){i.value=a==='rmin'?raiseCtx.lo:raiseCtx.hi;raiseCost()}break}
    case'raiseconfirm':{
      const v=Math.floor(+($('#r_val')||{}).value);
      if(!raiseCtx||!(v>=raiseCtx.lo&&v<=raiseCtx.hi)){toast('Enter a stake from '+(raiseCtx?raiseCtx.lo+' to '+raiseCtx.hi:'the allowed range'));break}
      closeSheet();act('raise',v);break;
    }
    case'start':hostCtl('start');break;
    case'reset':hostCtl('reset');break;
    case'force':hostCtl('force');break;
    case'kick':hostCtl('kick',b.dataset.id);break;
    case'tolobby':closeSheet();hostCtl('lobby');break;
    case'share':share();break;
    case'menu':openSheet(menuH());break;
    case'settings':if(view)openSheet(settingsH());break;
    case'savesettings':
      hostCtl('settings',{maxPlayers:$('#s_max').value,boot:$('#s_boot').value,chips:$('#s_chips').value,potLimit:$('#s_pot').value,maxBlind:$('#s_blind').value});
      closeSheet();break;
    case'history':openSheet(histH());break;
    case'rules':openSheet(rulesH());break;
    case'theme':prefs.theme=prefs.theme==='dark'?'light':'dark';savePrefs();openSheet(menuH());break;
    case'sound':prefs.sound=!prefs.sound;savePrefs();openSheet(menuH());beep(660);break;
    case'vib':prefs.vib=!prefs.vib;savePrefs();openSheet(menuH());vib(60);break;
    case'leave':if(confirm(role==='host'?'Close the room for everyone?':'Leave this room?'))leave();break;
    case'close':closeSheet();break;
    case'cancel':leave();break;
  }
});

/* ---------- boot ---------- */
showHome();
(function init(){
  let s=LS.get('tp_session',null);
  if(s&&!(s.at&&Date.now()-s.at<3*3600*1000)){LS.del('tp_session');LS.del('tp_G');s=null}
  if(s&&s.role==='host'){
    const saved=LS.get('tp_G',null);
    if(saved&&saved.hostPid===me.pid){me.name=s.name||me.name;hostStart(saved);return}
  }
  if(s&&s.role==='client'&&s.code){me.name=s.name||me.name;clientStart(s.code,true);return}
  const q=new URLSearchParams(location.search).get('room');
  if(q&&!me.name){const n=$('#nm');if(n)n.focus()}
})();
})();
</script>
</body>
